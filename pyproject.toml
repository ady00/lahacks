[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-z3"
version = "0.1.0"
description = "Jev-based natural language accounting rule classifier to Z3 logical proofs"
authors = [{ name = "LA Hacks Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "fastapi",
    "uvicorn[standard]",
    "pytest",
    "sentry-sdk[fastapi]",
]

[project.scripts]
jev-z3 = "jev_z3.cli:main"

[tool.pytest.ini_options]
testpaths = ["engine", "api", "tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["jev_z3*", "api*", "engine*"]
